name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Tests (SQL Server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Start SQL Server
        run: bash .github/scripts/start-sqlserver.sh

      - name: Restore
        run: dotnet restore TeeTimeBooking.slnx

      - name: Build
        run: dotnet build TeeTimeBooking.slnx --configuration Release --no-restore

      - name: Test
        env:
          ConnectionStrings__TeeTimesTest: Server=localhost,1433;Database=TeeTimeBooking_Test;User Id=sa;Password=${{ env.SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=True
        run: >
          dotnet test TeeTimeBooking.slnx --configuration Release --no-build
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build

  container:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag teetime-booking:ci .

      - name: Start SQL Server
        run: bash .github/scripts/start-sqlserver.sh

      - name: Run the container
        env:
          ConnectionStrings__TeeTimes: Server=host.docker.internal,1433;Database=TeeTimeBooking;User Id=sa;Password=${{ env.SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=True
        run: >
          docker run --detach --name app --publish 8080:8080
          --add-host host.docker.internal:host-gateway
          --env ConnectionStrings__TeeTimes
          teetime-booking:ci

      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/health > /dev/null; then break; fi
            sleep 2
          done
          set -x
          curl --silent --fail http://localhost:8080/health | grep -q Healthy
          curl --silent --fail http://localhost:8080/ | grep -q '<div id="root">'
          curl --silent --fail http://localhost:8080/api/tee-times | grep -q '"course"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://localhost:8080/api/demo/reset)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/openapi/v1.json)" = 404

      - name: Container logs
        if: always()
        run: docker logs app || true

  # Only a main that passed everything above gets an image: tagged with the commit and as latest.
  publish:
    name: Publish image
    needs: [test, web, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --tag "$IMAGE:${{ github.sha }}" --tag "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # Rolls the commit's image out to Azure Container Apps. Signs in with OIDC: the federated credential trusts only
  # the production environment, which only main may deploy to, and the role covers one resource group.
  deploy:
    name: Deploy to Azure
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://teetime-booking.yellowrock-3c024f16.swedencentral.azurecontainerapps.io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update the container app
        run: >
          az containerapp update --resource-group rg-teetime-demo --name teetime-booking
          --image ghcr.io/${{ github.repository }}:${{ github.sha }} --output none

      - name: Wait until the new revision is ready and serving
        run: |
          app="--resource-group rg-teetime-demo --name teetime-booking"
          for attempt in $(seq 1 30); do
            latest=$(az containerapp show $app --query properties.latestRevisionName -o tsv)
            ready=$(az containerapp show $app --query properties.latestReadyRevisionName -o tsv)
            if [ "$latest" = "$ready" ]; then break; fi
            sleep 10
          done
          image=$(az containerapp revision show $app --revision "$latest" --query "properties.template.containers[0].image" -o tsv)
          echo "revision $latest ready=$ready image=$image"
          test "$latest" = "$ready"
          test "$image" = "ghcr.io/${{ github.repository }}:${{ github.sha }}"
          curl --silent --fail --max-time 90 \
            https://teetime-booking.yellowrock-3c024f16.swedencentral.azurecontainerapps.io/health | grep -q Healthy
