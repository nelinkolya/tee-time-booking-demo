name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      load_tests:
        description: Run load tests
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Tests (SQL Server)
    # A newer push to the same branch cancels this; it has no side effects worth finishing.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Start SQL Server
        run: bash .github/scripts/start-sqlserver.sh

      - name: Restore
        run: dotnet restore TeeTimeBooking.slnx

      - name: Build
        run: dotnet build TeeTimeBooking.slnx --configuration Release --no-restore

      - name: Test
        env:
          ConnectionStrings__TeeTimesTest: Server=localhost,1433;Database=TeeTimeBooking_Test;User Id=sa;Password=${{ env.SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=True
          # Load tests only on a manual run with the box ticked.
          TEST_FILTER: ${{ !inputs.load_tests && '--filter Category!=Load' || '' }}
        run: >
          dotnet test TeeTimeBooking.slnx --configuration Release --no-build $TEST_FILTER
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  web:
    name: Web build
    concurrency:
      group: web-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build

  container:
    name: Docker image smoke test
    concurrency:
      group: container-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: >
          docker build --tag teetime-booking:ci
          --build-arg GIT_SHA=${{ github.sha }}
          --build-arg BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ) .

      - name: Start SQL Server
        run: bash .github/scripts/start-sqlserver.sh

      - name: Run the container
        env:
          ConnectionStrings__TeeTimes: Server=host.docker.internal,1433;Database=TeeTimeBooking;User Id=sa;Password=${{ env.SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=True
        # As in Azure: a one-off container applies the migrations, then the app starts without touching the schema.
        run: |
          docker run --rm --add-host host.docker.internal:host-gateway --env ConnectionStrings__TeeTimes \
            teetime-booking:ci --migrate
          docker run --detach --name app --publish 8080:8080 \
            --add-host host.docker.internal:host-gateway --env ConnectionStrings__TeeTimes \
            --env Database__MigrateOnStartup=false \
            teetime-booking:ci

      - name: Smoke test
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/health > /dev/null; then break; fi
            sleep 2
          done
          set -x
          curl --silent --fail http://localhost:8080/health | grep -q Healthy
          curl --silent --fail http://localhost:8080/health/live | grep -q Healthy
          curl --silent --fail http://localhost:8080/ | grep -q '<div id="root">'
          curl --silent --fail http://localhost:8080/api/tee-times | grep -q '"course"'
          curl --silent --fail http://localhost:8080/api/version | grep -q '"commit":"${{ github.sha }}"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://localhost:8080/api/demo/reset)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/openapi/v1.json)" = 404

      - name: Container logs
        if: always()
        run: docker logs app || true

  # Only a main that passed everything above gets an image: tagged with the commit and as latest.
  publish:
    name: Publish image
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: true
    needs: [test, web, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --tag "$IMAGE:${{ github.sha }}" --tag "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # Rolls the commit's image out to Azure Container Apps. Signs in with OIDC: the federated credential trusts only
  # the production environment, which only main may deploy to, and the role covers one resource group.
  deploy:
    name: Deploy to Azure
    # Deployments run one at a time and never get cancelled: a newer one waits until this one has rolled out
    # and been verified. (Only the newest waiting deployment is kept.)
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://teetime-booking.yellowrock-3c024f16.swedencentral.azurecontainerapps.io
    permissions:
      contents: read
      id-token: write
    steps:
      # Third-party action: pinned to a commit, since a tag can be moved. Dependabot keeps the pin current.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Before the app gets the new image: a failed migration stops the deployment, and no revision is created.
      - name: Run the migrations
        run: |
          job="--resource-group rg-teetime-demo --name job-teetime-migrate"
          az containerapp job update $job --image ghcr.io/${{ github.repository }}:${{ github.sha }} --output none
          execution=$(az containerapp job start $job --query name -o tsv)
          for attempt in $(seq 1 60); do
            status=$(az containerapp job execution show $job --job-execution-name "$execution" --query properties.status -o tsv)
            echo "$execution: $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) exit 1 ;;
            esac
            sleep 10
          done
          echo "The migration job did not finish in time." >&2
          exit 1

      - name: Update the container app
        run: >
          az containerapp update --resource-group rg-teetime-demo --name teetime-booking
          --image ghcr.io/${{ github.repository }}:${{ github.sha }} --output none

      - name: Wait until the new revision is ready and serving
        run: |
          app="--resource-group rg-teetime-demo --name teetime-booking"
          for attempt in $(seq 1 30); do
            latest=$(az containerapp show $app --query properties.latestRevisionName -o tsv)
            ready=$(az containerapp show $app --query properties.latestReadyRevisionName -o tsv)
            if [ "$latest" = "$ready" ]; then break; fi
            sleep 10
          done
          image=$(az containerapp revision show $app --revision "$latest" --query "properties.template.containers[0].image" -o tsv)
          echo "revision $latest ready=$ready image=$image"
          test "$latest" = "$ready"
          test "$image" = "ghcr.io/${{ github.repository }}:${{ github.sha }}"
          curl --silent --fail --max-time 90 \
            https://teetime-booking.yellowrock-3c024f16.swedencentral.azurecontainerapps.io/health | grep -q Healthy
